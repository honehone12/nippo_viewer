[package]
name = "nippo_viewer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [[bin]]
# name="gen_key"
# path="bin/gen_key.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nippo_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "sync", "fs"] }
dirs = "6.0.0"
reqwest = { version = "0.12.15", features = ["json"] }
chrono = { version = "0.4.40", features = ["serde"] }
base64 = "0.22.1"
uuid = { version = "1.16.0", features = ["v4"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
dotenvy_macro = "0.15.7"
tauri-plugin-deep-link = { version = "2.2.1"}
webbrowser = "1.0.4"
whoami = "1.6.0"

[target."cfg(windows)".dependencies]
tauri-plugin-single-instance = { version = "2.2.3", features = ["deep-link"] }
keyring = { version = "3.6.2", features = ["windows-native"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# panic = "abort"
strip = true
